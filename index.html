<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#030712">
    <title>Worker Monitoring | Tactical Command</title>
    
    <!-- External Libraries -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700;800;900&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- UNIFIED STYLESHEET -->
    <style>
        :root {
            var(--bg-base): #030712;
            var(--brand-primary): #00e5ff;
            var(--accent-danger): #ef4444;
            var(--z-modal): 999999; /* Absolute max priority */
        }

        /* Essential Reset & Basic Styles */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #030712; color: #fff; overflow-x: hidden; }
        
        /* ... (Keep your existing beautiful CSS from earlier here for the main UI) ... */
        
        /* Tactical Header (Abbreviated for brevity, assume full styles here) */
        .app-header { padding: 16px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(3, 7, 18, 0.85); border-bottom: 1px solid rgba(0, 229, 255, 0.15); }
        .brand h1 { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; color: #fff; }
        
        /* Dashboard & Panels */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 30px; padding: 40px 5%; }
        .panel { background: rgba(15, 23, 42, 0.8); border-radius: 16px; padding: 32px; border: 1px solid rgba(255,255,255,0.05); }
        .panel-header { display: flex; gap: 16px; margin-bottom: 28px; }
        .panel h2 { font-size: 1.15rem; }
        
        /* Forms & Buttons */
        input { width: 100%; background: #000; color: #fff; padding: 16px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 24px; border-radius: 8px; font-family: 'JetBrains Mono'; }
        .btn { padding: 16px 28px; border-radius: 8px; font-weight: 800; cursor: pointer; border: none; font-family: 'JetBrains Mono'; text-transform: uppercase; }
        .btn-primary { background: rgba(0, 229, 255, 0.1); color: #00e5ff; border: 1px solid rgba(0, 229, 255, 0.4); }
        .btn-submit { background: #fff; color: #000; width: 100%; }
        .btn-sensor { background: rgba(16, 185, 129, 0.1); color: #10b981; width: 100%; margin-bottom: 12px; }

        /* Maps & SVG */
        .map-container-hero, .svg-container-hero { width: 100%; height: 650px; background: #000; border-radius: 8px; }
        #map, #graphSvg { width: 100%; height: 100%; }

        /* FAB */
        .fab-container { position: fixed; bottom: 50px; right: 50px; z-index: 500; }
        .fab-sos { background: #ef4444; color: #fff; padding: 20px 40px; border-radius: 99px; font-weight: 900; border: none; cursor: pointer; }

        /* ========================================================== */
        /* CRITICAL FIX: MAN-DOWN MODAL STYLING                       */
        /* ========================================================== */
        .man-down-modal {
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(239, 68, 68, 0.95); /* More opaque */
            z-index: 999999; /* Absolute top priority */
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
            /* Remove animation on the container itself to prevent touch issues on mobile */
        }

        .md-content {
            background: #000; padding: 40px; border-radius: 16px; text-align: center;
            border: 3px solid #ef4444; box-shadow: 0 0 50px rgba(0,0,0,0.8); 
            max-width: 90%; width: 400px;
            /* Ensure this specific block allows pointer events */
            pointer-events: auto; 
            /* Add subtle pulse here instead */
            animation: innerPulse 1s infinite alternate; 
        }

        @keyframes innerPulse { from { box-shadow: 0 0 30px rgba(239,68,68,0.5); } to { box-shadow: 0 0 80px rgba(239,68,68,1); } }

        .md-content h2 { color: #fff; font-size: 24px; margin-bottom: 16px; font-family: 'JetBrains Mono', monospace; }
        .md-content p { color: #ccc; font-size: 16px; margin-bottom: 20px; line-height: 1.4; }
        .md-countdown { font-size: 80px; color: #ef4444; font-family: 'JetBrains Mono', monospace; font-weight: 900; margin: 30px 0; line-height: 1; }
        
        .md-cancel-btn {
            background: #00e5ff; color: #000; width: 100%; padding: 20px;
            font-size: 1.2rem; font-weight: 900; font-family: 'JetBrains Mono', monospace;
            border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0,229,255,0.4);
            transition: transform 0.1s;
        }
        .md-cancel-btn:active { transform: scale(0.95); }

    </style>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="brand"><h1>WORKER MONITORING</h1></div>
        <div class="status-hud">
            <strong id="statRole" style="color:#00e5ff;">AWAITING</strong>
            <strong id="statActive">0 Tracked</strong>
        </div>
    </header>

    <!-- Main Content -->
    <main class="dashboard-grid">
        <!-- Auth -->
        <section class="panel">
            <div class="panel-header"><h2>01 Command & Connect</h2></div>
            <input type="text" id="groupCodeInput" placeholder="Site Code (e.g. TEAM123)">
            <div style="display:flex; gap:10px;">
                <button id="createGroupBtn" class="btn btn-primary" style="flex:1;">Create</button>
                <button id="joinGroupActionBtn" class="btn btn-primary" style="flex:1;">Join</button>
            </div>
        </section>

        <!-- Identity -->
        <section class="panel">
            <div class="panel-header"><h2>02 Node Identity</h2></div>
            <input type="text" id="nameInput" placeholder="Operator Name">
            <input type="text" id="designationInput" placeholder="Role">
            <button id="captureBtn" class="btn btn-sensor">Auto-Fetch GPS</button>
            <div id="gpsReadout" hidden style="margin-bottom: 15px; color:#00e5ff;"></div>
            <button id="addBtn" class="btn btn-submit" disabled>Inject</button>
        </section>

        <!-- Roster (Simplified for brevity) -->
        <section class="panel panel-large">
            <div class="panel-header"><h2>03 Active Personnel</h2></div>
            <ul id="rosterList" style="list-style:none;"></ul>
        </section>

        <!-- Maps (Simplified) -->
        <section class="panel panel-hero">
            <div class="panel-header"><h2>04 Topography</h2></div>
            <div class="map-container-hero"><div id="map"></div></div>
        </section>
        
        <section class="panel panel-hero">
            <div class="panel-header"><h2>05 Spatial Elevation</h2></div>
            <div class="svg-container-hero"><svg id="graphSvg"></svg></div>
        </section>

        <!-- Config -->
        <section class="panel">
            <div class="panel-header"><h2>06 Calibration</h2></div>
            <label>Geofence Radius (m)</label>
            <input type="number" id="geofenceRadiusInput" value="500">
            <label>Man-Down Timer (mins)</label>
            <input type="number" id="manDownInput" value="3">
        </section>
    </main>

    <!-- FAB -->
    <div class="fab-container"><button id="sosTriggerBtn" class="fab-sos">🚨 SOS</button></div>

    <!-- ============================================================== -->
    <!-- CRITICAL FIX: MAN DOWN MODAL (HARDWIRED AND SIMPLIFIED)        -->
    <!-- ============================================================== -->
    <div id="manDownModal" class="man-down-modal" style="display: none;">
        <div class="md-content">
            <h2>⚠️ INACTIVITY DETECTED</h2>
            <p>System detects no movement. Alert triggering in:</p>
            <div id="mdCountdown" class="md-countdown">30</div>
            <!-- Standard button with clear ID for JS binding, removing inline onclick to ensure clean execution context -->
            <button id="mdCancelActionBtn" class="md-cancel-btn">I AM OKAY</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT ENGINE                          -->
    <!-- ========================================== -->
    <script>
        (function () {
            "use strict";

            // State
            const STATE = {
                role: "worker", groupCode: null, mySelfId: null, liveTrackingId: null,
                group: [], mapInstance: null, mapMarkers: {},
                lastMoveTime: Date.now(),
                lastMoveLat: null, lastMoveLon: null,
                mdCheckInterval: null,
                mdCountdownInterval: null,
                mdActive: false
            };

            // Audio Synth
            const AudioEngine = {
                ctx: null, activeNodes: [], sirenInterval: null,
                init: function() { try { this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} },
                trigger: function(isManDown = false) {
                    this.init(); this.stop();
                    if (!this.ctx) return;
                    if (this.ctx.state === 'suspended') this.ctx.resume();
                    const play = () => {
                        try {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.frequency.value = isManDown ? 440 : 880;
                            gain.gain.setValueAtTime(0, this.ctx.currentTime);
                            gain.gain.linearRampToValueAtTime(0.3, this.ctx.currentTime + 0.05);
                            gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.5);
                            osc.connect(gain).connect(this.ctx.destination);
                            osc.start(); osc.stop(this.ctx.currentTime + 0.6);
                            this.activeNodes.push(osc);
                        } catch(e){}
                    };
                    play();
                    if (isManDown) this.sirenInterval = setInterval(play, 1000);
                },
                stop: function() {
                    if (this.sirenInterval) clearInterval(this.sirenInterval);
                    this.activeNodes.forEach(n => { try{n.stop(); n.disconnect();}catch(e){} });
                    this.activeNodes = [];
                }
            };

            // Unlock audio on click
            document.body.addEventListener('click', () => AudioEngine.init(), {once:true});

            // Mock Socket for demo
            let socket = { on: ()=>{}, emit: ()=>{} };
            try { if(typeof io !== 'undefined') socket = io(); } catch(e){}

            // Map Init
            setTimeout(() => {
                if (document.getElementById('map') && typeof L !== 'undefined') {
                    STATE.mapInstance = L.map('map').setView([20.5937, 78.9629], 5);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(STATE.mapInstance);
                }
            }, 500);

            // Basic Interactions
            document.getElementById('createGroupBtn').onclick = () => alert("Group Created (Demo)");
            document.getElementById('captureBtn').onclick = () => {
                document.getElementById('gpsReadout').hidden = false;
                document.getElementById('gpsReadout').innerText = "Lock Acquired!";
                document.getElementById('addBtn').disabled = false;
            };
            
            document.getElementById('addBtn').onclick = () => {
                STATE.mySelfId = "OP-123";
                STATE.group.push({id: STATE.mySelfId, name: document.getElementById('nameInput').value, height: 0});
                startTracking();
                alert("Injected into grid.");
            };

            // ==========================================
            // CRITICAL FIX: MAN DOWN LOGIC
            // ==========================================
            function startTracking() {
                STATE.lastMoveTime = Date.now();
                
                // Simulate GPS moving
                setInterval(() => {
                    if (STATE.mdActive) return;
                    // In real life, calculate distance here. For this fix, we just assume they didn't move if they don't press a button.
                }, 1000);

                // Check for inactivity
                STATE.mdCheckInterval = setInterval(() => {
                    if (STATE.mdActive) return;
                    const mins = parseFloat(document.getElementById('manDownInput').value) || 3;
                    // For testing, if we set to 0.1, it triggers in 6 seconds
                    if (Date.now() - STATE.lastMoveTime > (mins * 60 * 1000)) {
                        triggerManDownWarning();
                    }
                }, 5000); // Check every 5s
            }

            // EXPOSE GLOBALLY SO IT CANNOT BE MISSED
            window.executeCancelManDown = function() {
                console.log("CANCEL FIRED");
                // Stop Countdown
                clearInterval(STATE.mdCountdownInterval);
                
                // Hide Modal
                const modal = document.getElementById('manDownModal');
                if (modal) modal.style.display = 'none'; // Use display none instead of hidden
                
                // Reset State
                STATE.mdActive = false;
                STATE.lastMoveTime = Date.now(); // Give them a full new window
                
                // Kill Audio
                AudioEngine.stop();
            };

            // Bind the button specifically using standard addEventListener for touch support
            const cancelBtn = document.getElementById('mdCancelActionBtn');
            if(cancelBtn) {
                // Use both click and touchstart for absolute mobile reliability
                cancelBtn.addEventListener('click', (e) => { e.preventDefault(); window.executeCancelManDown(); });
                cancelBtn.addEventListener('touchstart', (e) => { e.preventDefault(); window.executeCancelManDown(); }, {passive: false});
            }

            function triggerManDownWarning() {
                if (STATE.mdActive) return;
                STATE.mdActive = true;
                
                const modal = document.getElementById('manDownModal');
                const countdownEl = document.getElementById('mdCountdown');
                
                if (modal) modal.style.display = 'flex'; // Ensure it flexes correctly
                AudioEngine.trigger(true); 
                
                let timeLeft = 30;
                if (countdownEl) countdownEl.innerText = timeLeft;
                
                // Clear any existing interval just in case
                if(STATE.mdCountdownInterval) clearInterval(STATE.mdCountdownInterval);

                STATE.mdCountdownInterval = setInterval(() => {
                    timeLeft--;
                    if (countdownEl) countdownEl.innerText = timeLeft;
                    
                    if (timeLeft <= 0) {
                        clearInterval(STATE.mdCountdownInterval);
                        if (modal) modal.style.display = 'none';
                        AudioEngine.stop();
                        
                        alert("🚨 GLOBAL MAN-DOWN SOS TRIGGERED! 🚨");
                        // In real code, emit socket SOS here
                    }
                }, 1000);
            }

        })();
    </script>
</body>
</html>
